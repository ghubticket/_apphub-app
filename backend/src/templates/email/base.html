<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #f5f5f5;
        }
        .email-wrapper {
            padding: 20px 0;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 3px solid #1a1a1a;
        }
        .header {
            background: #1a1a1a;
            color: #ffffff;
            padding: 32px 30px;
            text-align: center;
            border-bottom: 3px solid #1a1a1a;
        }
        .header h1 {
            font-size: 32px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .content {
            padding: 40px 30px;
            background: #ffffff;
        }
        .content h2 {
            font-size: 24px;
            margin: 0 0 24px 0;
            font-weight: 700;
            color: #1a1a1a;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 12px;
        }
        .content h3 {
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: 600;
            color: #1a1a1a;
        }
        .content h4 {
            font-size: 16px;
            margin: 0 0 8px 0;
            font-weight: 600;
            color: #1a1a1a;
        }
        .content p {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: #333333;
        }
        .content ul {
            margin: 12px 0;
            padding-left: 24px;
        }
        .content li {
            margin: 8px 0;
            font-size: 16px;
            color: #333333;
        }
        .content strong {
            font-weight: 600;
            color: #1a1a1a;
        }
        .footer {
            background: #f5f5f5;
            padding: 24px 30px;
            text-align: center;
            font-size: 12px;
            color: #666666;
            border-top: 2px solid #1a1a1a;
        }
        .footer p {
            margin: 4px 0;
        }
        .button {
            display: inline-block;
            background: #1a1a1a;
            color: #ffffff;
            padding: 16px 32px;
            text-decoration: none;
            border: 2px solid #1a1a1a;
            margin: 20px 0;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .button:hover {
            background: #ffffff;
            color: #1a1a1a;
        }
        .info-box {
            background: #ffffff;
            border: 2px solid #2196F3;
            padding: 20px;
            margin: 24px 0;
        }
        .info-box h3 {
            color: #2196F3;
            margin-bottom: 16px;
        }
        .warning-box {
            background: #ffffff;
            border: 2px solid #FF9800;
            padding: 20px;
            margin: 24px 0;
        }
        .warning-box h3 {
            color: #FF9800;
            margin-bottom: 16px;
        }
        .success-box {
            background: #ffffff;
            border: 2px solid #4CAF50;
            padding: 20px;
            margin: 24px 0;
        }
        .success-box h3 {
            color: #4CAF50;
            margin-bottom: 16px;
        }
        .error-box {
            background: #ffffff;
            border: 2px solid #F44336;
            padding: 20px;
            margin: 24px 0;
        }
        .error-box h3 {
            color: #F44336;
            margin-bottom: 16px;
        }
        code {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 12px;
            display: block;
            border: 2px solid #1a1a1a;
            word-break: break-all;
            font-size: 14px;
        }
        @media only screen and (max-width: 600px) {
            .email-wrapper {
                padding: 0;
            }
            .email-container {
                border-left: none;
                border-right: none;
            }
            .content {
                padding: 24px 20px;
            }
            .header {
                padding: 24px 20px;
            }
            .header h1 {
                font-size: 24px;
            }
            .content h2 {
                font-size: 20px;
            }
            .footer {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <div class="header">
                <h1>EventHub</h1>
            </div>
            <div class="content">
                {{content}}
            </div>
            <div class="footer">
                <p>© {{year}} EventHub. Todos os direitos reservados.</p>
                <p>Este é um email automático, por favor não responda.</p>
            </div>
        </div>
    </div>
</body>
</html>
